<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>School Bus Live Tracking & Telematics</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
        }

        .app-root {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            position: relative;
        }

        header {
            background: #1e293b;
            color: #f8fafc;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            z-index: 1000;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            border-bottom: 1px solid #334155;
        }

        .brand-section {
            min-width: 0;
        }

        .brand-title {
            font-size: clamp(0.95rem, 3vw, 1.15rem);
            font-weight: 700;
            color: #38bdf8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .telemetry-subtext {
            font-size: clamp(0.75rem, 2.2vw, 0.85rem);
            color: #94a3b8;
            margin-top: 2px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-cctv-toggle {
            background: #334155;
            color: #e2e8f0;
            border: 1px solid #475569;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .btn-cctv-toggle:hover {
            background: #475569;
            color: #fff;
        }

        .badge-status {
            flex-shrink: 0;
            background: #16a34a;
            color: white;
            padding: 5px 12px;
            border-radius: 9999px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .badge-offline {
            background: #dc2626;
        }

        #map-wrapper {
            flex: 1 1 auto;
            width: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Floating CCTV Video Card */
        .video-card {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 320px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
            transition: width 0.3s ease, height 0.3s ease, opacity 0.2s ease;
        }

        .video-card.hidden {
            display: none;
        }

        .video-card.expanded {
            width: 520px;
        }

        .video-header {
            padding: 8px 12px;
            background: #1e293b;
            color: #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .video-title {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background: #ef4444;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 6px #ef4444;
        }

        .video-controls button {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 2px 5px;
            transition: color 0.15s;
        }

        .video-controls button:hover {
            color: #f8fafc;
        }

        .video-frame-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #020617;
            position: relative;
        }

        .video-frame-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Bottom Telemetry Card */
        .telemetry-card {
            position: absolute;
            bottom: 16px;
            left: 16px;
            max-width: calc(100% - 32px);
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #e2e8f0;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .telemetry-card strong {
            color: #38bdf8;
        }

        @media (max-width: 640px) {
            .video-card {
                width: calc(100% - 32px);
                right: 16px;
                top: 12px;
            }

            .video-card.expanded {
                width: calc(100% - 32px);
            }
        }
    </style>
</head>

<body>

    <div class="app-root">
        <header>
            <div class="brand-section">
                <div class="brand-title">School Bus Pilot: Fleet #01</div>
                <div class="telemetry-subtext">
                    <span id="stat-time">Waiting for data...</span>
                    <span>•</span>
                    <span id="stat-speed">Speed: -- km/h</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="toggle-cctv-btn" class="btn-cctv-toggle">
                    <span>📹</span> Cam
                </button>
                <div id="status-pill" class="badge-status badge-offline">Offline</div>
            </div>
        </header>

        <div id="map-wrapper">
            <div id="map"></div>

            <!-- Floating In-Cabin Video Player -->
            <div id="video-card" class="video-card">
                <div class="video-header">
                    <span class="video-title">
                        <span class="live-dot"></span> Cabin Cam (WebRTC)
                    </span>
                    <div class="video-controls">
                        <button id="expand-cam-btn" title="Expand / Shrink">⤢</button>
                        <button id="close-cam-btn" title="Hide Video">✕</button>
                    </div>
                </div>
                <div class="video-frame-container">
                    <iframe id="cctv-stream-frame" src="" allow="autoplay; fullscreen"></iframe>
                </div>
            </div>

            <div class="telemetry-card">
                <div><strong>Vehicle:</strong> MH-04-AB-1234 (Thane Stn &harr; Manpada)</div>
                <div id="stat-coords">Coords: 19.18652, 72.97576</div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', {
            zoomControl: true,
            attributionControl: false
        }).setView([19.18652, 72.97576], 15);

        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);

        map.zoomControl.setPosition('bottomright');

        const busIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png',
            iconSize: [36, 36],
            iconAnchor: [18, 18],
            popupAnchor: [0, -18]
        });

        let busMarker = null;
        const pathCoordinates = [];

        const busPath = L.polyline([], {
            color: '#0284c7',
            weight: 5,
            opacity: 0.9,
            lineJoin: 'round'
        }).addTo(map);

        const statusPill = document.getElementById('status-pill');
        const statTime = document.getElementById('stat-time');
        const statSpeed = document.getElementById('stat-speed');
        const statCoords = document.getElementById('stat-coords');

        // Smooth Animation Engine (Interpolation)
        let animStart = null;
        let animDuration = 2500;
        let startLatLng = null;
        let targetLatLng = null;
        let animFrameId = null;

        function animateMarker(timestamp) {
            if (!animStart) animStart = timestamp;
            const elapsed = timestamp - animStart;
            const progress = Math.min(elapsed / animDuration, 1);

            const currentLat = startLatLng.lat + (targetLatLng.lat - startLatLng.lat) * progress;
            const currentLng = startLatLng.lng + (targetLatLng.lng - startLatLng.lng) * progress;

            busMarker.setLatLng([currentLat, currentLng]);

            if (progress < 1) {
                animFrameId = requestAnimationFrame(animateMarker);
            }
        }

        function smoothlyMoveMarker(toLat, toLng) {
            if (!busMarker) {
                busMarker = L.marker([toLat, toLng], { icon: busIcon }).addTo(map)
                    .bindPopup(`<b>School Bus #01</b><br>Live Tracking Active`)
                    .openPopup();
                map.panTo([toLat, toLng]);
                return;
            }

            startLatLng = busMarker.getLatLng();
            targetLatLng = { lat: toLat, lng: toLng };
            animStart = null;

            if (animFrameId) cancelAnimationFrame(animFrameId);
            animFrameId = requestAnimationFrame(animateMarker);

            map.panTo([toLat, toLng], { animate: true, duration: 2.0 });
        }

        // Automatically picks either 'localhost' or your laptop's Wi-Fi IP
        const currentHost = window.location.hostname;

        // 1. Set video frame source dynamically
        document.getElementById('cctv-stream-frame').src = `http://${currentHost}:8889/bus_cam/`;

        // 2. Connect WebSocket to the unified server (port 3000)
        const socket = new WebSocket(`ws://${window.location.host}`);

        socket.onopen = () => {
            statusPill.innerText = 'Live';
            statusPill.classList.remove('badge-offline');
        };

        socket.onclose = () => {
            statusPill.innerText = 'Offline';
            statusPill.classList.add('badge-offline');
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'BUS_TELEMETRY') {
                const { lat, lng, speed, timestamp } = data;

                statTime.innerText = `Updated: ${timestamp}`;
                statSpeed.innerText = `Speed: ${speed} km/h`;
                statCoords.innerText = `Coords: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;

                pathCoordinates.push([lat, lng]);
                busPath.setLatLngs(pathCoordinates);

                smoothlyMoveMarker(lat, lng);
            }
        };

        // UI Controls for Video Card
        const videoCard = document.getElementById('video-card');
        const toggleCctvBtn = document.getElementById('toggle-cctv-btn');
        const expandCamBtn = document.getElementById('expand-cam-btn');
        const closeCamBtn = document.getElementById('close-cam-btn');

        toggleCctvBtn.addEventListener('click', () => {
            videoCard.classList.toggle('hidden');
        });

        closeCamBtn.addEventListener('click', () => {
            videoCard.classList.add('hidden');
        });

        expandCamBtn.addEventListener('click', () => {
            videoCard.classList.toggle('expanded');
        });

        window.addEventListener('resize', () => {
            map.invalidateSize();
        });
    </script>
</body>

</html>
